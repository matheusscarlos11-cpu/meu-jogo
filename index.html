<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jogo 2D Controle Real</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x:canvas.width/2, y:canvas.height-150, size:40, hp:5 };

let bullets = [];
let enemyBullets = [];
let enemies = [];
let obstacles = [{x:canvas.width/2-100,y:canvas.height/2,w:200,h:30}];

for(let i=0;i<5;i++){
  enemies.push({x:Math.random()*(canvas.width-50),y:Math.random()*200+20,size:40});
}

let joystick = {
  baseX:80,
  baseY:canvas.height-100,
  knobX:80,
  knobY:canvas.height-100,
  radius:50,
  active:false
};

let shootBtn = {
  x:canvas.width-100,
  y:canvas.height-100,
  r:40
};

canvas.addEventListener("touchstart", e=>{
  let t = e.touches[0];

  // Joystick
  let dx = t.clientX - joystick.baseX;
  let dy = t.clientY - joystick.baseY;
  if(Math.sqrt(dx*dx+dy*dy) < joystick.radius){
    joystick.active = true;
  }

  // Botão atirar
  let sx = t.clientX - shootBtn.x;
  let sy = t.clientY - shootBtn.y;
  if(Math.sqrt(sx*sx+sy*sy) < shootBtn.r){
    bullets.push({x:player.x+15,y:player.y,vy:-8});
  }
});

canvas.addEventListener("touchmove", e=>{
  if(joystick.active){
    let t = e.touches[0];
    let dx = t.clientX - joystick.baseX;
    let dy = t.clientY - joystick.baseY;

    let dist = Math.sqrt(dx*dx+dy*dy);
    if(dist > joystick.radius){
      dx *= joystick.radius/dist;
      dy *= joystick.radius/dist;
    }

    joystick.knobX = joystick.baseX + dx;
    joystick.knobY = joystick.baseY + dy;

    player.x += dx*0.1;
    player.y += dy*0.1;
  }
});

canvas.addEventListener("touchend", ()=>{
  joystick.active=false;
  joystick.knobX = joystick.baseX;
  joystick.knobY = joystick.baseY;
});

function update(){

  bullets.forEach(b=> b.y+=b.vy);
  enemyBullets.forEach(b=> b.y+=b.vy);

  enemies.forEach(e=>{
    if(Math.random()<0.01){
      enemyBullets.push({x:e.x+15,y:e.y+40,vy:4});
    }
  });

  bullets = bullets.filter(b=> b.y>0);
  enemyBullets = enemyBullets.filter(b=> b.y<canvas.height);

  bullets.forEach(b=>{
    enemies = enemies.filter(e=>{
      return !(b.x<e.x+40 && b.x+8>e.x && b.y<e.y+40 && b.y+8>e.y);
    });
  });

  enemyBullets.forEach(b=>{
    if(b.x<player.x+40 && b.x+8>player.x &&
       b.y<player.y+40 && b.y+8>player.y){
      player.hp--;
      if(player.hp<=0){
        alert("Você perdeu!");
        location.reload();
      }
    }
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle="green";
  ctx.fillRect(player.x,player.y,40,40);

  // Inimigos
  ctx.fillStyle="blue";
  enemies.forEach(e=> ctx.fillRect(e.x,e.y,40,40));

  // Tiros
  ctx.fillStyle="lime";
  bullets.forEach(b=> ctx.fillRect(b.x,b.y,8,8));

  ctx.fillStyle="cyan";
  enemyBullets.forEach(b=> ctx.fillRect(b.x,b.y,8,8));

  // Obstáculo
  ctx.fillStyle="gray";
  obstacles.forEach(o=> ctx.fillRect(o.x,o.y,o.w,o.h));

  // HP
  ctx.fillStyle="red";
  ctx.fillText("HP: "+player.hp,20,30);

  // Joystick base
  ctx.beginPath();
  ctx.arc(joystick.baseX, joystick.baseY, joystick.radius, 0, Math.PI*2);
  ctx.strokeStyle="white";
  ctx.stroke();

  // Joystick botão
  ctx.beginPath();
  ctx.arc(joystick.knobX, joystick.knobY, 20, 0, Math.PI*2);
  ctx.fillStyle="white";
  ctx.fill();

  // Botão atirar
  ctx.beginPath();
  ctx.arc(shootBtn.x, shootBtn.y, shootBtn.r, 0, Math.PI*2);
  ctx.fillStyle="red";
  ctx.fill();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
