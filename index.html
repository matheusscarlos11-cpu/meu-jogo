<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jogo do matheus:)</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: white;
}
canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let coelho = {
    x: 80,
    y: canvas.height - 120,
    width: 40,
    height: 40,
    dy: 0,
    gravity: 0.6,
    jump: -12,
    grounded: true
};

let obstaculo = {
    x: canvas.width,
    y: canvas.height - 100,
    width: 40,
    height: 60
};

let velocidade = 6;
let pontos = 0;
let gameOver = false;

function desenharCoelho() {
    ctx.fillStyle = "blue";
    ctx.fillRect(coelho.x, coelho.y, coelho.width, coelho.height);
}

function desenharObstaculo() {
    ctx.fillStyle = "green";
    ctx.fillRect(obstaculo.x, obstaculo.y, obstaculo.width, obstaculo.height);
}

function atualizar() {
    if (gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // gravidade
    coelho.dy += coelho.gravity;
    coelho.y += coelho.dy;

    if (coelho.y + coelho.height >= canvas.height - 60) {
        coelho.y = canvas.height - 60 - coelho.height;
        coelho.dy = 0;
        coelho.grounded = true;
    }

    // mover obstáculo
    obstaculo.x -= velocidade;

    if (obstaculo.x + obstaculo.width < 0) {
        obstaculo.x = canvas.width;
        pontos++;
    }

    // colisão
    if (
        coelho.x < obstaculo.x + obstaculo.width &&
        coelho.x + coelho.width > obstaculo.x &&
        coelho.y < obstaculo.y + obstaculo.height &&
        coelho.y + coelho.height > obstaculo.y
    ) {
        gameOver = true;
        alert("Game Over! Pontos: " + pontos);
        location.reload();
    }

    desenharCoelho();
    desenharObstaculo();

    requestAnimationFrame(atualizar);
}

// PULAR (funciona no celular)
window.addEventListener("touchstart", pular);
window.addEventListener("click", pular);

function pular() {
    if (coelho.grounded) {
        coelho.dy = coelho.jump;
        coelho.grounded = false;
    }
}

atualizar();
</script>

</body>
</html>
