<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo de Corrida 2D com Tiro</title>
    <style>
        body {
            margin: 0;
            background: #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #555;
            border: 2px solid #000;
        }
        .controls {
            margin-top: 10px;
        }
        .controls button {
            width: 100px;
            height: 50px;
            font-size: 18px;
            margin: 5px;
            border-radius: 10px;
            border: none;
            background-color: orange;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div class="controls">
    <button id="leftBtn">⬅️ Esquerda</button>
    <button id="rightBtn">Direita ➡️</button>
    <button id="shootBtn">💥 Atirar</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const canvasWidth = canvas.width;
const canvasHeight = canvas.height;

// Carro
const carWidth = 50;
const carHeight = 100;
let carX = canvasWidth / 2 - carWidth / 2;
let carY = canvasHeight - carHeight - 10;
const carSpeed = 5;

// Obstáculos
const obstacleWidth = 50;
const obstacleHeight = 50;
let obstacles = [];
const obstacleSpeed = 4;
let spawnTimer = 0;

// Tiros
const bullets = [];
const bulletWidth = 10;
const bulletHeight = 20;
const bulletSpeed = 7;

// Pontuação
let score = 0;

// Controles
let leftPressed = false;
let rightPressed = false;

// Eventos teclado
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') leftPressed = true;
    if (e.key === 'ArrowRight') rightPressed = true;
});

document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') leftPressed = false;
    if (e.key === 'ArrowRight') rightPressed = false;
});

// Botões touchscreen
document.getElementById('leftBtn').addEventListener('mousedown', () => leftPressed = true);
document.getElementById('leftBtn').addEventListener('mouseup', () => leftPressed = false);
document.getElementById('rightBtn').addEventListener('mousedown', () => rightPressed = true);
document.getElementById('rightBtn').addEventListener('mouseup', () => rightPressed = false);

document.getElementById('leftBtn').addEventListener('touchstart', (e) => { leftPressed = true; e.preventDefault(); });
document.getElementById('leftBtn').addEventListener('touchend', (e) => { leftPressed = false; e.preventDefault(); });
document.getElementById('rightBtn').addEventListener('touchstart', (e) => { rightPressed = true; e.preventDefault(); });
document.getElementById('rightBtn').addEventListener('touchend', (e) => { rightPressed = false; e.preventDefault(); });

// Botão de atirar
document.getElementById('shootBtn').addEventListener('click', shoot);
document.getElementById('shootBtn').addEventListener('touchstart', (e) => { shoot(); e.preventDefault(); });

function shoot() {
    bullets.push({ x: carX + carWidth / 2 - bulletWidth / 2, y: carY - bulletHeight });
}

// Gerar obstáculos
function spawnObstacle() {
    const x = Math.random() * (canvasWidth - obstacleWidth);
    obstacles.push({ x: x, y: -obstacleHeight });
}

// Atualizar jogo
function update() {
    if (leftPressed && carX > 0) carX -= carSpeed;
    if (rightPressed && carX < canvasWidth - carWidth) carX += carSpeed;

    // Atualizar obstáculos
    obstacles.forEach((obs, oIndex) => {
        obs.y += obstacleSpeed;

        // Colisão com carro
        if (carX < obs.x + obstacleWidth &&
            carX + carWidth > obs.x &&
            carY < obs.y + obstacleHeight &&
            carY + carHeight > obs.y) {
            alert('Game Over! Pontuação: ' + score);
            document.location.reload();
        }

        // Colisão com tiros
        bullets.forEach((b, bIndex) => {
            if (b.x < obs.x + obstacleWidth &&
                b.x + bulletWidth > obs.x &&
                b.y < obs.y + obstacleHeight &&
                b.y + bulletHeight > obs.y) {
                obstacles.splice(oIndex, 1);
                bullets.splice(bIndex, 1);
                score += 2; // Pontuação extra por destruir
            }
        });

        if (obs.y > canvasHeight) {
            obstacles.splice(oIndex, 1);
            score++;
        }
    });

    // Atualizar tiros
    bullets.forEach((b, index) => {
        b.y -= bulletSpeed;
        if (b.y + bulletHeight < 0) bullets.splice(index, 1);
    });

    // Spawn obstáculos
    spawnTimer++;
    if (spawnTimer > 60) {
        spawnObstacle();
        spawnTimer = 0;
    }
}

// Desenhar jogo
function draw() {
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    // Carro
    ctx.fillStyle = 'orange';
    ctx.fillRect(carX, carY, carWidth, carHeight);

    // Obstáculos
    ctx.fillStyle = 'red';
    obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obstacleWidth, obstacleHeight));

    // Tiros
    ctx.fillStyle = 'yellow';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, bulletWidth, bulletHeight));

    // Pontuação
    ctx.fillStyle = 'white';
    ctx.font = '20px Arial';
    ctx.fillText('Pontuação: ' + score, 10, 30);
}

// Loop principal
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
