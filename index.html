<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jogo 2D Matheus</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = {
  x: canvas.width/2,
  y: canvas.height-120,
  size: 40,
  hp: 5
};

let bullets = [];
let enemyBullets = [];
let enemies = [];
let obstacles = [{x:canvas.width/2-100,y:canvas.height/2,w:200,h:30}];

for(let i=0;i<5;i++){
  enemies.push({
    x: Math.random()*(canvas.width-50),
    y: Math.random()*200+20,
    size:40
  });
}

let joystick = {active:false,x:0,y:0};

canvas.addEventListener("touchstart", e=>{
  let t = e.touches[0];
  if(t.clientX < canvas.width/2){
    joystick.active = true;
    joystick.x = t.clientX;
    joystick.y = t.clientY;
  } else {
    bullets.push({x:player.x+15,y:player.y,vy:-8});
  }
});

canvas.addEventListener("touchmove", e=>{
  if(joystick.active){
    let t = e.touches[0];
    player.x += (t.clientX - joystick.x)*0.15;
    player.y += (t.clientY - joystick.y)*0.15;

    joystick.x = t.clientX;
    joystick.y = t.clientY;
  }
});

canvas.addEventListener("touchend", ()=> joystick.active=false);

function collisionRect(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

function update(){

  bullets.forEach(b=> b.y += b.vy);
  enemyBullets.forEach(b=> b.y += b.vy);

  enemies.forEach(e=>{
    if(Math.random()<0.01){
      enemyBullets.push({x:e.x+15,y:e.y+40,vy:4});
    }
  });

  bullets = bullets.filter(b=> b.y>0);
  enemyBullets = enemyBullets.filter(b=> b.y<canvas.height);

  bullets.forEach(b=>{
    let bulletRect = {x:b.x,y:b.y,w:8,h:8};

    obstacles.forEach(o=>{
      if(collisionRect(bulletRect,{x:o.x,y:o.y,w:o.w,h:o.h})){
        b.y=-100;
      }
    });

    enemies = enemies.filter(e=>{
      return !(b.x<e.x+40 && b.x+8>e.x && b.y<e.y+40 && b.y+8>e.y);
    });
  });

  enemyBullets.forEach(b=>{
    let bulletRect = {x:b.x,y:b.y,w:8,h:8};

    obstacles.forEach(o=>{
      if(collisionRect(bulletRect,{x:o.x,y:o.y,w:o.w,h:o.h})){
        b.y=canvas.height+100;
      }
    });

    if(b.x<player.x+40 && b.x+8>player.x &&
       b.y<player.y+40 && b.y+8>player.y){
      player.hp--;
      b.y=canvas.height+100;
      if(player.hp<=0){
        alert("Você perdeu!");
        location.reload();
      }
    }
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="green";
  ctx.fillRect(player.x,player.y,40,40);

  ctx.fillStyle="blue";
  enemies.forEach(e=> ctx.fillRect(e.x,e.y,40,40));

  ctx.fillStyle="green";
  bullets.forEach(b=> ctx.fillRect(b.x,b.y,8,8));

  ctx.fillStyle="blue";
  enemyBullets.forEach(b=> ctx.fillRect(b.x,b.y,8,8));

  ctx.fillStyle="gray";
  obstacles.forEach(o=> ctx.fillRect(o.x,o.y,o.w,o.h));

  ctx.fillStyle="red";
  ctx.fillText("HP: "+player.hp,20,30);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
