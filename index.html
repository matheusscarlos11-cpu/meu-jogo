<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Runner do Matheus</title>
<style>
body {
    margin: 0;
    background: white;
    overflow: hidden;
}
canvas {
    display: block;
    margin: auto;
    background: #f0f0f0;
}
</style>
</head>
<body>

<canvas id="game" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
    x: 100,
    y: 300,
    width: 50,
    height: 50,
    dy: 0,
    gravity: 0.8,
    jumping: false
};

let obstacle = {
    x: 600,
    y: 320,
    width: 40,
    height: 80,
    speed: 6
};

let score = 0;
let gameOver = false;

// Toque na tela para pular
canvas.addEventListener("click", () => {
    if (!player.jumping && !gameOver) {
        player.dy = -15;
        player.jumping = true;
    }
});

function update() {
    if (!gameOver) {

        // Gravidade
        player.dy += player.gravity;
        player.y += player.dy;

        if (player.y >= 300) {
            player.y = 300;
            player.jumping = false;
        }

        // Movimento obstáculo
        obstacle.x -= obstacle.speed;

        if (obstacle.x < -40) {
            obstacle.x = 600;
            score++;
        }

        // Colisão
        if (
            player.x < obstacle.x + obstacle.width &&
            player.x + player.width > obstacle.x &&
            player.y < obstacle.y + obstacle.height &&
            player.y + player.height > obstacle.y
        ) {
            gameOver = true;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Jogador
    ctx.fillStyle = "black";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Obstáculo azul
    ctx.fillStyle = "blue";
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

    // Pontos
    ctx.fillStyle = "black";
    ctx.font = "20px Arial";
    ctx.fillText("Pontos: " + score, 10, 30);

    if (gameOver) {
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 180, 200);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
